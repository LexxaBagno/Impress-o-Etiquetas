<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Impressão em Lote - BarTender</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; background-color: #f4f4f9; }
        .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 400px; }
        select, button { width: 100%; padding: 10px; margin-top: 10px; margin-bottom: 20px; font-size: 16px; border-radius: 4px; border: 1px solid #ccc; }
        button { background-color: #28a745; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #218838; }
        #status { font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Impressão de Etiquetas</h2>
        <label for="selectGrupos">Escolha o Grupo:</label>
        <select id="selectGrupos">
            <option value="">Carregando grupos...</option>
        </select>

        <button onclick="enviarImpressao()">Imprimir Tudo do Grupo</button>
        <div id="status"></div>
    </div>

    <script>
        // Carrega os grupos automaticamente ao abrir a página
        async function carregarGrupos() {
            try {
                const resposta = await fetch('/api/grupos');
                const grupos = await resposta.json();
                const select = document.getElementById('selectGrupos');
                
                select.innerHTML = '<option value="">Selecione um grupo...</option>';
                grupos.forEach(grupo => {
                    const option = document.createElement('option');
                    option.value = grupo;
                    option.textContent = grupo.toUpperCase();
                    select.appendChild(option);
                });
            } catch (error) {
                document.getElementById('status').style.color = 'red';
                document.getElementById('status').textContent = 'Erro ao carregar os grupos do servidor.';
            }
        }

        // Envia a ordem de impressão para o backend
        async function enviarImpressao() {
            const grupo = document.getElementById('selectGrupos').value;
            const statusDiv = document.getElementById('status');

            if (!grupo) {
                alert('Por favor, selecione um grupo primeiro.');
                return;
            }

            statusDiv.style.color = 'blue';
            statusDiv.textContent = 'Enviando arquivos para a impressora...';

            try {
                const resposta = await fetch('/api/imprimir', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ grupo })
                });

                const resultado = await resposta.json();
                if (resposta.ok) {
                    statusDiv.style.color = 'green';
                    statusDiv.textContent = resultado.mensagem;
                } else {
                    statusDiv.style.color = 'red';
                    statusDiv.textContent = resultado.erro;
                }
            } catch (error) {
                statusDiv.style.color = 'red';
                statusDiv.textContent = 'Erro de comunicação com o servidor.';
            }
        }

        carregarGrupos();
    </script>
</body>
</html>
