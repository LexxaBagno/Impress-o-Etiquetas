<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Impressão por Pedido (PDF)</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; background-color: #f4f4f9; }
        .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 450px; }
        input, select, button { width: 100%; padding: 10px; margin-top: 10px; margin-bottom: 20px; font-size: 16px; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background-color: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        #status { font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Impressão por Pedido (PDF)</h2>
        
        <label for="inputPdf">Selecione o PDF do Pedido:</label>
        <input type="file" id="inputPdf" accept="application/pdf">

        <label for="inputImpressora">Escolha a Impressora:</label>
        <select id="inputImpressora">
            <option value="Smart Color Print SMT-D2 (Padrão)">Smart Color Print SMT-D2 (Padrão)</option>
            <option value="Argox OS-214plus">Argox OS-214plus</option>
            <option value="Zebra ZT230">Zebra ZT230</option>
        </select>

        <button onclick="enviarPdf()">Ler PDF e Imprimir Etiquetas</button>
        <div id="status"></div>
    </div>

    <script>
        async function enviarPdf() {
            const fileInput = document.getElementById('inputPdf');
            const impressora = document.getElementById('inputImpressora').value;
            const statusDiv = document.getElementById('status');

            if (fileInput.files.length === 0) {
                alert('Por favor, selecione um ficheiro PDF.');
                return;
            }

            const file = fileInput.files[0];
            statusDiv.style.color = 'blue';
            statusDiv.textContent = 'A processar PDF e a descarregar do GitHub...';

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = async function () {
                try {
                    const resposta = await fetch('/api/imprimir-pdf', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ pdfBase64: reader.result, impressora })
                    });

                    const resultado = await resposta.json();
                    if (resposta.ok) {
                        statusDiv.style.color = 'green';
                        statusDiv.textContent = resultado.mensagem;
                    } else {
                        statusDiv.style.color = 'red';
                        statusDiv.textContent = resultado.erro;
                    }
                } catch (error) {
                    statusDiv.style.color = 'red';
                    statusDiv.textContent = 'Erro de comunicação com o servidor.';
                }
            };
        }
    </script>
</body>
</html>
